name: React SDK Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (already run on the push to master) and release directly'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: build and verify both packages, but do not publish to npm, push the tag or create the GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  test:
    if: |
      !contains(toJSON(github.event.commits.*.message), '[skip-ci]') &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        react_version: [16.9.0, 16.14.0, 17.0.2, 18.2.0]
        node_version: [ 18.x, 20.x, 21.x, 22.x ] # 12.x, 13.x, 14.x, 15.x, 16.x,

    name: Test on React ${{ matrix.react_version }} using Node.js ${{ matrix.node_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version:  ${{ matrix.node_version }}

      - name: Copy appropriate package.json
        run: |
          if [[ ${{ matrix.node_version }} == 12* ]]; then
            cp package-below-node-16.json package.json
          elif [[ ${{ matrix.node_version }} == 13* ]]; then
            cp package-below-node-16.json package.json
          elif [[ ${{ matrix.node_version }} == 14* ]]; then
            cp package-below-node-16.json package.json
          elif [[ ${{ matrix.node_version }} == 15* ]]; then
            cp package-below-node-16.json package.json
          elif [[ ${{ matrix.node_version }} == 16* ]]; then
            cp package-below-node-16.json package.json
          elif [[ ${{ matrix.node_version }} == 17* ]]; then
            cp package-below-node-16.json package.json
          elif [[ ${{ matrix.node_version }} == 19* ]]; then
            cp package-below-node-16.json package.json
          fi
      - name: Install dependencies
        run: |
          yarn add react@${{ matrix.react_version }} react-dom@${{ matrix.react_version }} react-test-renderer@${{ matrix.react_version }}

          # Use compatible version of @testing-library/react for React < 18
          if [[ "${{ matrix.react_version }}" =~ ^16.* || "${{ matrix.react_version }}" =~ ^17.* ]]; then
            yarn add @testing-library/react@12 @testing-library/react-hooks@5
          else
            yarn add @testing-library/react @testing-library/react-hooks
          fi
          yarn install

      - name: Run tests
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Notification
        if: always()
        id: slack
        uses: wingify/slack-github-action@v1.15.1-wingify
        with:
          channel-id: 'vwo-fs-fme-sdk-job-status' # 'fs-review-team'
          slack-message: "<!here> React FME SDK Test on *Node-${{ matrix.node_version }}* on *${{ matrix.os }}* using *React-${{ matrix.react_version }}* got *${{job.status}}* ${{job.status == 'success' && ':heavy_check_mark:' || ':x:'}} \nCommit: `${{github.event.head_commit.message}}`. \nCheck the latest build: https://github.com/wingify/vwo-fme-react-sdk/actions"
          color: "${{job.status == 'success' && '#00FF00' || '#FF0000'}}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}

  release:
    needs: test
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      (needs.test.result == 'success' || (github.event.inputs.skip_tests == 'true' && needs.test.result != 'cancelled'))
    name: Release to npm
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run release script
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: bash ./scripts/release.sh
